---
# Standalone apiserver Deployment — the LINSTOR-compatible REST front
# end split out of the controller binary. Three replicas behind a
# Service so linstor-csi / `linstor` CLI / piraeus-operator polling
# spreads across pods, leaving the single-leader controller binary
# free of view-API contention.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockstor-apiserver
  namespace: blockstor-system
---
# RBAC narrowed compared to the controller's role. The REST
# handlers don't:
#   - update Status (only reconcilers + satellites do, via the
#     /status subresource — apiserver's grep -E
#     '\.(Status\(\)|SetState)' is empty in pkg/rest).
#   - touch /finalizers (only reconcilers add/strip).
#   - emit Events (no reconcile-trigger writes from REST).
#   - need leases (leader election is off — every apiserver
#     replica serves independently).
# What's left is plain CRUD on the blockstor.io CRDs themselves,
# plus the passphrase Secret in this namespace (the Role below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blockstor-apiserver
rules:
  - apiGroups: [blockstor.org]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
---
# The cluster passphrase (`blockstor-cluster-passphrase` by default;
# override via ControllerConfig.Spec.PassphraseSecretRef) is read on
# every `linstor encryption enter-passphrase` and written on
# `create-passphrase` / `modify-passphrase`. It is read past the
# controller-runtime cache (rest.Server.SecretReader), so no informer
# lists or watches Secrets and a get in this namespace is all the read
# needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blockstor-apiserver-secrets
  namespace: blockstor-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blockstor-apiserver-secrets
  namespace: blockstor-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blockstor-apiserver-secrets
subjects:
  - kind: ServiceAccount
    name: blockstor-apiserver
    namespace: blockstor-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blockstor-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blockstor-apiserver
subjects:
  - kind: ServiceAccount
    name: blockstor-apiserver
    namespace: blockstor-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockstor-apiserver
  namespace: blockstor-system
  labels: {app: blockstor-apiserver}
spec:
  # Three replicas keeps reads serving on a per-pod restart while
  # the operator rolls the apiserver image. Reads are stateless;
  # writes go straight through to apiserver with optimistic
  # concurrency on resourceVersion, so two replicas can write
  # concurrently and the apiserver arbitrates.
  replicas: 3
  selector: {matchLabels: {app: blockstor-apiserver}}
  template:
    metadata: {labels: {app: blockstor-apiserver}}
    spec:
      serviceAccountName: blockstor-apiserver
      # The REST server's graceful-shutdown window is derived from the
      # detached rollback budget (pkg/rest/rg_deleted_race.go); this has to
      # outlive it, or a SIGTERM kills a compensation mid-cascade.
      terminationGracePeriodSeconds: 21
      # Spread replicas across nodes when possible so a single
      # node loss doesn't take all apiserver pods at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: blockstor-apiserver}
      containers:
        - name: apiserver
          image: __REGISTRY__/blockstor-apiserver:dev
          imagePullPolicy: Always
          args:
            # Plain-HTTP debug listener with no authentication. Bound to
            # loopback, so only `kubectl port-forward` to this pod reaches
            # it (local debugging, the `linstor` CLI); other pods cannot.
            - --rest-bind-address=127.0.0.1:3370
            # Mutual-TLS listener. The ONLY port the Service exposes.
            # Requires + verifies client certs against the mounted CA;
            # hot-reloads cert/key/CA on cert-manager rotation without a
            # restart (no reloader.stakater.com).
            - --tls-bind-address=:3371
            - --tls-cert-file=/etc/blockstor/tls/tls.crt
            - --tls-key-file=/etc/blockstor/tls/tls.key
            - --tls-client-ca-file=/etc/blockstor/tls/ca.crt
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            # rest-tls is the in-cluster endpoint (Service-exposed).
            - {name: rest-tls, containerPort: 3371}
            - {name: health, containerPort: 8081}
          volumeMounts:
            # cert-manager-issued serving material (tls.crt/tls.key/
            # ca.crt). The apiserver re-reads all three on rotation via
            # an fsnotify watch on this dir — no pod restart needed.
            - name: api-tls
              mountPath: /etc/blockstor/tls
              readOnly: true
          # Bug 218: probes hit the controller-runtime manager's
          # /healthz and /readyz endpoints on the named `health`
          # port. tcpSocket on the REST port (3370) marked the pod
          # Ready as soon as the listener bound, defeating the
          # cache-sync + REST-bind gate landed for Bug 213. The
          # livenessProbe must also be an HTTP GET so a manager
          # deadlock (listener still up, /healthz wedged) actually
          # triggers a kubelet restart. Mirrors the canonical
          # pattern in stand/blockstor-satellite-daemonset.yaml.
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: api-tls
          secret:
            secretName: blockstor-apiserver-server-tls
---
# In-cluster Service for the apiserver. mTLS-only: it exposes ONLY
# the TLS port (3371). The plain-HTTP debug port (3370) is
# deliberately NOT listed here — it stays reachable only via
# `kubectl port-forward` to a pod, so nothing on the network can
# talk plaintext to the apiserver. Clients dial
# https://blockstor-apiserver.blockstor-system.svc:3371 presenting a
# client cert (see blockstor-apiserver-tls.yaml).
apiVersion: v1
kind: Service
metadata:
  name: blockstor-apiserver
  namespace: blockstor-system
spec:
  selector: {app: blockstor-apiserver}
  ports:
    - {name: rest-tls, port: 3371, targetPort: 3371}
