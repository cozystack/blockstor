name: Pull Request

# Single consolidated CI pipeline for PRs. Fires on every PR open/push and
# runs lint, unit tests, contract tests, and e2e in parallel. The e2e job
# carries an opt-in SSH breakpoint (label-gated) so maintainers can attach
# to a wedged sandbox and resume the workflow with `breakpoint resume`.
#
# Runner topology:
#   - lint, unit-test, contract → GitHub-hosted `ubuntu-latest` (ephemeral).
#   - e2e → self-hosted (needs KVM/large RAM for kind+blockstor sandbox).
#     Adjust the `runs-on:` label to match the ephemeral runner pool once
#     ARC / namespace.so / equivalent is wired up.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   - BREAKPOINT_ENDPOINT (required for the breakpoint step; if unset, the
#     step is skipped — forks cannot reach the rendezvous server anyway
#     because variables are not exposed in fork-PR workflows).
#
# Labels that change behaviour:
#   - debug   → pins the e2e job to a self-hosted runner so a maintainer can
#               attach via the host (kubectl/docker on the runner host
#               directly, no SSH dance through the rendezvous server). The
#               breakpoint step itself fires on every e2e failure regardless
#               of label — it just needs BREAKPOINT_ENDPOINT to be set.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR when a new push arrives — saves
# runner minutes on rapid force-push iterations.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Running tests
        run: |
          go mod tidy
          make test

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Build contract image
        run: |
          docker build -t blockstor-drbd-contract:local \
            -f tests/contract/Dockerfile tests/contract/
      - name: Contract tests
        run: |
          go test -tags=contract -count=1 -timeout=5m -v ./tests/contract/... \
            | tee contract.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-logs
          path: contract.log

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Clone
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install linstor-client (python-linstor)
        # See .github/workflows/integration.yml for the install path
        # rationale; this mirrors that step so PR runs match push runs.
        # Pin v1.27.1 to match `linstor_client.VERSION` the integration
        # harness asserts on (tests/integration/group_h_test.go).
        run: |
          python3 -m pip install --break-system-packages --upgrade \
            python-linstor==1.27.1 argcomplete
          python3 -m pip install --break-system-packages --no-deps \
            https://github.com/LINBIT/linstor-client/archive/refs/tags/v1.27.1.tar.gz
          linstor --version
      - name: Install envtest binaries
        # controller-runtime's envtest needs kube-apiserver + etcd
        # binaries. We track the release branch matching our
        # controller-runtime (v0.23.x). `@latest` would resolve to
        # the v0.24.x submodule, which requires Go >= 1.26.
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use --print path 1.34.x)" >> "$GITHUB_ENV"
      - name: go mod tidy
        run: go mod tidy
      - name: Build (ensures harness compiles)
        run: go build ./...
      - name: Integration tests
        run: |
          go test -tags=integration -count=1 -timeout=15m ./tests/integration/... | tee integration.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-logs
          path: |
            integration.log
            /tmp/envtest-*.log

  e2e:
    name: E2E
    # Runner selection mirrors cozystack/cozystack: a labelled `debug` PR
    # lands on a long-lived `self-hosted` runner so the breakpoint step
    # below has somewhere stable to attach SSH; regular PRs land on the
    # CNCF-provided Oracle pool (24 CPU / 96 GB / x86-64) which has
    # enough headroom for kind + real-DRBD QEMU stands (Talos VMs in
    # .work/<stand>, ~50 GB RAM, KVM nested virt). The pool labels are
    # org-wide on cozystack, so no extra setup is required here. Swap
    # to oracle-vm-32cpu-128gb-x86-64 if a future scenario needs more
    # RAM/CPU.
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'debug') && 'self-hosted' || 'oracle-vm-24cpu-96gb-x86-64' }}
    needs: [detect-changes, lint, unit-test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

      # Open an SSH breakpoint to the failing e2e runner so maintainers
      # can attach, inspect kind/blockstor state, and resume with
      # `breakpoint resume`. Fires on every e2e failure (no label opt-in)
      # — the rationale is that an e2e failure already burned the runner
      # minutes and a maintainer almost always wants to inspect the wedged
      # cluster before tear-down. Forks can't reach the rendezvous server
      # because repository variables are not exposed to fork-PR workflows;
      # the step is silently skipped in that case (BREAKPOINT_ENDPOINT
      # comes through empty).
      #
      # Uses cozystack/breakpoint-action (fork of namespacelabs/breakpoint-action)
      # pinned by SHA. The fork adds pause-idle mode (initial grace period
      # for the first SSH connection, idle-aware exit afterwards), endpoint
      # output, and a dedicated Check Run "Breakpoint Open" that carries
      # the SSH endpoint in output.summary while the breakpoint is paused.
      - name: Breakpoint on E2E failure
        if: |
          failure() &&
          vars.BREAKPOINT_ENDPOINT != ''
        # cozystack/breakpoint-action v2-cozy.1
        # mode: pause-idle defaults: grace-period=20m, idle-timeout=10m
        uses: cozystack/breakpoint-action@a6f3a6f87be398ad63b6577351e3398e53f578e4
        with:
          mode: pause-idle
          endpoint: ${{ vars.BREAKPOINT_ENDPOINT }}
          authorized-users: androndo, Arsolitt, IvanHunters, kvaps, lexfrei, lllamnyp, mattia-eleuteri, matthieu-robin, myasnikovdaniil, sircthulhu, tym83
          check-run-name: "Breakpoint Open"
          github-token: ${{ github.token }}
          check-run-summary-template: |
            ## 🔴 SSH breakpoint open — paused for debug

            ```
            {endpoint}
            ```

            Inspect the e2e sandbox:
            ```
            kubectl get pods -A
            kind get clusters
            ```

            Resume from inside: `breakpoint resume`. Otherwise the breakpoint
            exits 10 minutes after the last SSH session disconnects.

  e2e-stand:
    name: E2E (stand, real-DRBD)
    # Real-DRBD Talos+QEMU stand e2e. Gated by the `e2e-stand` label so
    # it stays opt-in until proven stable on the runner pool; promote to
    # always-on once the wall-time / flake profile is well understood.
    #
    # Runner: same Oracle pool the kind-based `e2e` job uses
    # (oracle-vm-24cpu-96gb-x86-64) — 24 vCPU / 96 GB RAM with KVM
    # nested-virt available on /dev/kvm. The job preflights /dev/kvm
    # and fails fast if soft-emulation would be the fallback (a Talos
    # boot on TCG would blow well past the 90-minute budget).
    #
    # Scope (happy-path slice, per the approved design plan):
    #   - 1 cluster: 1 control-plane + 3 workers, Talos v1.10.5,
    #     extensions drbd+zfs, 8 GB extra disk per worker (slimmed
    #     from dev-stand default of 16 GB to keep total disk pressure
    #     low on the runner — only 3 scenarios run before tear-down)
    #   - 3 scenarios: no-drbd, toggle-disk, tiebreaker. Sequential.
    #   - Always-on tear-down via `make down` in `if: always()`.
    #
    # Wall-time budget: ~45-75 min (Talos boot ~10 min cached / ~20
    # min cold, blockstor+pools install ~5 min, 3 scenarios ~10-20
    # min each). 90-minute timeout-minutes cap.
    # Runner: self-hosted Talos-host with KVM and DRBD module preloaded.
    # The CNCF Oracle pool runner does NOT expose /dev/kvm (verified 2026-
    # 05-22), and GitHub-hosted ubuntu-latest does not ship the DRBD
    # kernel module. The only realistic place to run real Talos+QEMU+
    # DRBD e2e is the blockstor dev stand, which already has KVM,
    # registered DRBD module, and provisioning scripts. Register the
    # stand as a self-hosted runner (one-time setup, see docs/CI-RUNNER-
    # SETUP.md) with the `e2e-stand` label; the job is gated on the
    # `e2e-stand` PR label so only labelled PRs claim the runner.
    runs-on: [self-hosted, e2e-stand]
    needs: [detect-changes, lint, unit-test]
    if: |
      contains(github.event.pull_request.labels.*.name, 'e2e-stand') &&
      needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    env:
      STAND_NAME: ci-e2e
      EXTRA_DISK_SIZE_MB: "8192"
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Preflight: /dev/kvm must be writable. The stand boots Talos
      # under qemu-kvm; soft-emulation (TCG) would push a 4-worker
      # cluster boot past the 90-minute budget. Fail fast with a clear
      # diagnostic so the runner pool issue is obvious in the log.
      - name: Probe /dev/kvm
        run: |
          set -e
          if [[ ! -w /dev/kvm ]]; then
            echo "FAIL: /dev/kvm not writable on this runner."
            echo "      Stand boot requires KVM nested-virt; soft-emulation"
            echo "      would blow the 90-min job budget. Check runner pool."
            ls -l /dev/kvm 2>&1 || echo "/dev/kvm absent entirely"
            exit 1
          fi
          echo "OK: /dev/kvm writable"
          ls -l /dev/kvm

      - name: Install QEMU + talosctl + jq + dnsmasq-base
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf jq dnsmasq-base \
            iproute2 bridge-utils curl ca-certificates
          # talosctl release matches stand/up.sh TALOS_VERSION default.
          TALOS_VERSION=v1.10.5
          curl -fL "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64" \
            -o /tmp/talosctl
          chmod +x /tmp/talosctl
          sudo mv /tmp/talosctl /usr/local/bin/talosctl
          talosctl version --client

      # Cache the Talos Image Factory artifacts (schematic id, kernel,
      # initrd, installer) across runs. Key on Talos version + sha256
      # of the extension list so a Talos bump or extension change
      # cleanly invalidates the cache.
      - name: Cache Talos factory artifacts
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: .work/_factory
          key: talos-factory-v1.10.5-drbd-zfs

      # Local Docker registry the stand pushes blockstor/apiserver/
      # satellite images to. Talos VMs reach it via the bridge gateway
      # (.1 of the cluster CIDR); see stand/up.sh registry-mirror patch.
      - name: Start local Docker registry
        run: |
          docker run -d -p 5000:5000 --restart=always \
            --name registry registry:2
          # Give it a moment to start accepting pushes.
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:5000/v2/ >/dev/null; then
              echo "registry up"; break
            fi
            sleep 1
          done

      - name: Build images (controller + apiserver + satellite)
        run: make build-images

      - name: Bring up Talos+QEMU stand
        run: |
          make up NAME="$STAND_NAME" EXTRA_DISK_SIZE_MB="$EXTRA_DISK_SIZE_MB"

      - name: Install blockstor on stand
        run: make blockstor NAME="$STAND_NAME"

      - name: Provision storage pools (zfs + lvm-thin)
        run: make pools NAME="$STAND_NAME" TYPE=both

      - name: E2E scenario — no-drbd
        run: make e2e NAME="$STAND_NAME" SCENARIO=no-drbd

      - name: E2E scenario — toggle-disk
        run: make e2e NAME="$STAND_NAME" SCENARIO=toggle-disk

      - name: E2E scenario — tiebreaker
        run: make e2e NAME="$STAND_NAME" SCENARIO=tiebreaker

      # Diagnostics on failure: cluster-info dump + dmesg per node.
      # KUBECONFIG / TALOSCONFIG land under .work/$STAND_NAME by the
      # stand Makefile convention.
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          set +e
          DIAG=.work/${STAND_NAME}/diagnostics
          mkdir -p "$DIAG"
          export KUBECONFIG=".work/${STAND_NAME}/kubeconfig"
          export TALOSCONFIG=".work/${STAND_NAME}/talosconfig"
          kubectl cluster-info dump --all-namespaces \
            --output-directory="$DIAG/cluster-info" >/dev/null 2>&1
          kubectl get pods -A -o wide > "$DIAG/pods.txt" 2>&1
          kubectl get nodes -o wide > "$DIAG/nodes.txt" 2>&1
          kubectl -n blockstor-system get all -o wide \
            > "$DIAG/blockstor-system.txt" 2>&1
          kubectl get resources.blockstor.io.blockstor.io -A -o yaml \
            > "$DIAG/resources.yaml" 2>&1
          kubectl get resourcedefinitions.blockstor.io.blockstor.io -A -o yaml \
            > "$DIAG/resourcedefinitions.yaml" 2>&1
          # Per-node dmesg via talosctl (best-effort: talos may be
          # wedged itself on a bad boot).
          for node in $(talosctl config info -o yaml 2>/dev/null \
              | awk '/nodes:/{f=1;next} /endpoints:/{f=0} f{gsub(/[- ]/,"");print}'); do
            talosctl -n "$node" dmesg > "$DIAG/dmesg-${node}.txt" 2>&1 || true
            talosctl -n "$node" logs -k > "$DIAG/kernel-${node}.txt" 2>&1 || true
          done
          ls -la "$DIAG"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-stand-diagnostics
          path: .work/${{ env.STAND_NAME }}/diagnostics
          if-no-files-found: warn

      # SSH breakpoint mirroring the kind-based e2e job (lines 241-268
      # above). Identical wiring, distinct check-run-name so a parallel
      # breakpoint from the kind job doesn't clobber this one.
      - name: Breakpoint on E2E (stand) failure
        if: |
          failure() &&
          vars.BREAKPOINT_ENDPOINT != ''
        uses: cozystack/breakpoint-action@a6f3a6f87be398ad63b6577351e3398e53f578e4
        with:
          mode: pause-idle
          endpoint: ${{ vars.BREAKPOINT_ENDPOINT }}
          authorized-users: androndo, Arsolitt, IvanHunters, kvaps, lexfrei, lllamnyp, mattia-eleuteri, matthieu-robin, myasnikovdaniil, sircthulhu, tym83
          check-run-name: "Breakpoint Open (e2e-stand)"
          github-token: ${{ github.token }}
          check-run-summary-template: |
            ## 🔴 SSH breakpoint open — paused for debug (e2e-stand)

            ```
            {endpoint}
            ```

            Inspect the real-DRBD Talos stand:
            ```
            export KUBECONFIG=.work/ci-e2e/kubeconfig
            export TALOSCONFIG=.work/ci-e2e/talosconfig
            kubectl get pods -A
            kubectl -n blockstor-system get resources.blockstor.io.blockstor.io -A
            talosctl -n <node> dmesg | tail -100
            ```

            Resume from inside: `breakpoint resume`. Otherwise the breakpoint
            exits 10 minutes after the last SSH session disconnects.

      # Always tear the stand down so we don't leak qemu/dnsmasq onto
      # the runner. The runner pool is ephemeral, but `make down` also
      # frees the bridge / pid files in case any subsequent step on
      # the same runner needs them.
      - name: Tear down stand
        if: always()
        run: make down NAME="$STAND_NAME" || true
