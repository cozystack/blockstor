---
# The controller creates the keyring from the passphrase Secret and drops
# superseded slots; the REST endpoints it serves also write the generated
# unlock Secret. A create cannot be limited by name, so it is granted on
# its own (docs/encryption-keys.md says what that leaves open); get and
# update are limited to the Secrets blockstor uses.
# resourceNames: the keyring, the unlock Secret blockstor generates when no
# passphrase Secret is named, and the passphrase Secret under piraeus's
# name, linstor-passphrase. A ControllerConfig that names another
# passphrase Secret needs that name added here. Nothing else in the
# namespace is readable: under Cozystack it is shared with piraeus.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-secrets
  namespace: system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - blockstor-master-key
  - blockstor-unlock
  - linstor-passphrase
  verbs:
  - get
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-secrets
  namespace: system
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-secrets
