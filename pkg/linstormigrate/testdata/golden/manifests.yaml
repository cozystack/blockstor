---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ControllerConfig
metadata:
  name: default
spec:
  extraProps:
    DrbdOptions/auto-add-quorum-tiebreaker: "True"
    DrbdOptions/auto-verify-algo-allowed-list: crct10dif;crc32c;sha256
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: Node
metadata:
  name: node-a
spec:
  netInterfaces:
  - address: 10.10.0.1
    name: default-ipv4
    satelliteEncryptionType: SSL
    satellitePort: 3367
  props:
    Aux/topology/kubernetes.io/hostname: node-a
    CurStltConnName: default-ipv4
  type: SATELLITE
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: Node
metadata:
  name: node-b
spec:
  netInterfaces:
  - address: 10.10.0.2
    name: default-ipv4
    satelliteEncryptionType: SSL
    satellitePort: 3367
  type: SATELLITE
---
apiVersion: blockstor.cozystack.io/v1alpha1
