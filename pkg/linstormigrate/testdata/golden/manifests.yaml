    satelliteEncryptionType: SSL
    satellitePort: 3367
  type: SATELLITE
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: StoragePool
metadata:
  name: data.node-a
spec:
  nodeName: node-a
  poolName: data
  props:
    StorDriver/ZPoolThin: data
  providerKind: ZFS_THIN
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: StoragePool
metadata:
  name: data.node-b
spec:
  nodeName: node-b
  poolName: data
  props:
    StorDriver/ZPoolThin: data
  providerKind: ZFS_THIN
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: StoragePool
metadata:
  name: dfltdisklessstorpool.node-c
spec:
  nodeName: node-c
  poolName: DfltDisklessStorPool
  providerKind: DISKLESS
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceGroup
metadata:
  annotations:
    blockstor.io/linstor-name: DfltRscGrp
  name: dfltrscgrp
spec:
  selectFilter:
    placeCount: 2
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceGroup
metadata:
  name: sc-encrypted
spec:
  description: encrypted volumes
  selectFilter:
    layerStack:
    - DRBD
    - LUKS
    - STORAGE
    placeCount: 2
    storagePoolList:
    - data
  volumeGroups:
  - volumeNumber: 0
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceGroup
metadata:
  name: sc-replicated
spec:
  drbdOptions:
    net:
      protocol: A
    resource:
      quorum: majority
  selectFilter:
    layerStack:
    - DRBD
    - STORAGE
    placeCount: 2
    storagePoolList:
    - data
  volumeGroups:
  - volumeNumber: 0
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceDefinition
metadata:
  name: pvc-vol1
spec:
  drbdOptions:
    resource:
      quorum: majority
  drbdPort: 7001
  extraProps:
    Aux/csi.storage.k8s.io/pvc/name: app-data
    Aux/csi.storage.k8s.io/pvc/namespace: tenant-fixture
    DrbdOptions/Net/shared-secret: fixture-secret-vol1
    DrbdOptions/auto-verify-alg: crct10dif
    FileSystem/Type: ext4
  initialized: true
  layerStack:
  - DRBD
  - STORAGE
  props:
    Aux/csi.storage.k8s.io/pvc/name: app-data
    Aux/csi.storage.k8s.io/pvc/namespace: tenant-fixture
    FileSystem/Type: ext4
  resourceGroupName: sc-replicated
  volumeDefinitions:
  - drbdMinor: 1001
    props:
      DrbdCurrentGi: F1E2D3C4B5A69788
    sizeKib: 1048576
    volumeNumber: 0
  - drbdMinor: 1042
    sizeKib: 307200
    volumeNumber: 1
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceDefinition
metadata:
  name: pvc-vol2
spec:
  initialized: true
  layerStack:
  - STORAGE
  resourceGroupName: DfltRscGrp
  volumeDefinitions:
  - sizeKib: 524288
    volumeNumber: 0
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceDefinition
metadata:
  name: pvc-vol3
spec:
  extraProps:
    DrbdOptions/Net/shared-secret: fixture-secret-vol3
  initialized: true
  layerStack:
  - DRBD
  - LUKS
  - STORAGE
  resourceGroupName: sc-encrypted
  volumeDefinitions:
  - drbdMinor: 1003
    sizeKib: 2097152
    volumeNumber: 0
---
apiVersion: blockstor.cozystack.io/v1alpha1
kind: ResourceDefinition
metadata:
  name: pvc-vol5
spec:
  drbdOptions:
