name: file-thin-rs-discard-granularity
description: |
  Corner-case Q3: a FILE_THIN resource on a 4 KiB-discard loop backing
  MUST render `rs-discard-granularity` into its DRBD disk options so a
  partially-written volume resyncs only the written bytes (upstream
  parity), NOT the whole device.

  Pre-fix blockstor coupled rs-discard-granularity to the
  discard-zeroes-if-aligned provider gate and so emitted NO disk block at
  all for FILE_THIN — a 3rd-replica add resynced ~2x the bytes upstream
  LINSTOR did. This workflow asserts, at the operator-CLI level, that:

    1. the rendered DRBD config on the diskful node carries
       rs-discard-granularity (drbd_option, live `drbdsetup show`);
    2. discard-zeroes-if-aligned is `no` for FILE_THIN (provider gate
       unchanged); and
    3. adding a 3rd replica converges to a clean UpToDate sync.

  The byte-count win itself is measured by the L6 cli-matrix cell
  `file-thin-rs-discard-granularity.sh` (it dd's a partial pattern and
  compares received-KiB before vs after the fix).

prerequisites:
  min_nodes: 3
  storage_pool: stand

vars:
  sp: stand

steps:
  - name: create-rd
    cmd: ["resource-definition", "create", "{{rd}}"]
    expect_exit: 0
  - name: create-vd
    cmd: ["volume-definition", "create", "{{rd}}", "512M"]
    expect_exit: 0
  - name: r-c-diskful-node1
    cmd: ["resource", "create", "{{node1}}", "{{rd}}", "--storage-pool", "{{sp}}"]
    expect_exit: 0
    await:
      kind: disk_state
      rd: "{{rd}}"
      node: "{{node1}}"
      expected: UpToDate
      timeout_s: 120
  - name: assert-rs-discard-granularity-rendered
    cmd: ["resource", "list", "--resources", "{{rd}}"]
    expect_exit: 0
    await:
      kind: drbd_option
      rd: "{{rd}}"
      node: "{{node1}}"
      key: "rs-discard-granularity"
      expected: "4096"
      timeout_s: 60
  - name: assert-discard-zeroes-no
    cmd: ["resource", "list", "--resources", "{{rd}}"]
    expect_exit: 0
    await:
      kind: drbd_option
      rd: "{{rd}}"
      node: "{{node1}}"
      key: "discard-zeroes-if-aligned"
      expected: "no"
      timeout_s: 60
  - name: r-c-diskful-node2
    cmd: ["resource", "create", "{{node2}}", "{{rd}}", "--storage-pool", "{{sp}}"]
    expect_exit: 0
    await:
      kind: sync_clean
      rd: "{{rd}}"
      node: "{{node2}}"
      timeout_s: 300

teardown:
  - cmd: ["resource-definition", "delete", "{{rd}}"]

invariants:
  - no_orphans
