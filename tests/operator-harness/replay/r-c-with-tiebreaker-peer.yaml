name: r-c-with-tiebreaker-peer
description: |
  Bug-327 catcher. Cluster shape: 2 diskful replicas + 1 TieBreaker on
  a third node. Operator drops one diskful (`r d <node>`) then
  recreates with bare `r c <node> <rd>` (no flag). The recreated
  replica MUST come up DISKFUL — NOT silently coerced to Diskless
  because the TieBreaker is still resident on the same node.

prerequisites:
  min_nodes: 3
  storage_pool: stand

vars:
  sp: stand

steps:
  - name: create-rd
    cmd: ["resource-definition", "create", "{{rd}}"]
    expect_exit: 0
  - name: create-vd
    cmd: ["volume-definition", "create", "{{rd}}", "32M"]
    expect_exit: 0
  - name: r-c-node1-diskful
    cmd: ["resource", "create", "{{node1}}", "{{rd}}", "--storage-pool", "{{sp}}"]
    expect_exit: 0
  - name: r-c-node2-diskful
    cmd: ["resource", "create", "{{node2}}", "{{rd}}", "--storage-pool", "{{sp}}"]
    expect_exit: 0
  - name: wait-2-uptodate
    cmd: ["resource", "list", "--resources", "{{rd}}"]
    expect_exit: 0
    await:
      kind: all_uptodate
      rd: "{{rd}}"
      timeout_s: 240
  - name: ensure-tiebreaker-node3
    # tiebreaker auto-spawns on autoplace flows; we hand-create it on
    # node3 to make the scenario deterministic regardless of auto-tb
    # config.
    cmd: ["resource", "create", "{{node3}}", "{{rd}}", "--diskless"]
    expect_exit: 0
    await:
      kind: replica_diskless
      rd: "{{rd}}"
      node: "{{node3}}"
      timeout_s: 30
  - name: r-d-node2-diskful
    # Dropping node2's diskful replica leaves node1 diskful + the
    # hand-created node3 diskless peer. The shape is now 1 diskful + 1
    # user-diskless.
    #
    # An earlier revision asserted `tiebreaker_present` here, on the
    # premise that the controller keeps a DISKLESS *TieBreaker* resident
    # at this shape. That premise is wrong on two counts and the assert
    # could never hold (138s sweep timeout):
    #   1. node3 was created with a bare `r c --diskless` — it carries
    #      the DISKLESS flag only, NOT TIE_BREAKER, so it renders as
    #      `Diskless` (not `TieBreaker`) in `r l`; the case-sensitive
    #      `tiebreaker_present` grep never matches it.
    #   2. At 1 diskful the auto-tiebreaker invariant does NOT manage a
    #      witness at all — `shouldTieBreakerExist` only creates / keeps
    #      one at >= 2 diskful (quorum is off for a lone diskful;
    #      Bug-338 / BUG-040 #154). So no row ever flips to TIE_BREAKER.
    # The user-diskless peer simply stays resident (ensureTiebreaker
    # only reaps AUTO-managed witnesses, never operator-added diskless).
    # Assert exactly that observable truth: node3 is still Diskless. The
    # actual Bug-327 contract is the bare `r c node2` below — it must
    # come up DISKFUL despite a resident diskless peer.
    cmd: ["resource", "delete", "{{node2}}", "{{rd}}"]
    expect_exit: 0
    await:
      kind: replica_diskless
      rd: "{{rd}}"
      node: "{{node3}}"
      timeout_s: 120
  - name: r-c-node2-bare
    # No flag — operator expects diskful. Must NOT coerce to Diskless
    # just because a tiebreaker is parked on node3.
    cmd: ["resource", "create", "{{node2}}", "{{rd}}", "--storage-pool", "{{sp}}"]
    expect_exit: 0
    await:
      kind: disk_state
      rd: "{{rd}}"
      node: "{{node2}}"
      expected: UpToDate
      timeout_s: 240

teardown:
  - cmd: ["resource-definition", "delete", "{{rd}}"]

invariants:
  - no_orphans
