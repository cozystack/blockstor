name: vd-resize-bounds-rejected
description: |
  Adversarial round 4 (2026-07-03): `linstor vd set-size` (RESIZE) must
  enforce the SAME [4 MiB, 1 PiB] size bounds the CREATE path enforces
  (Bug 155). Pre-fix the resize path skipped validateVDSize, so an
  over-ceiling grow or a below-floor force-shrink was stored verbatim
  and the satellite hot-looped on `drbdadm create-md` — the Bug 155
  failure mode reached through the resize verb, no self-heal.

  Operator sequence codified here (CLI-driveable contract only — the
  runner drives the operator CLI):
    - grow to 1 PiB + 1 TiB (over ceiling)    -> MUST be rejected
    - size unchanged after the rejected grow
    - shrink to 3 MiB (below the 4 MiB floor) -> MUST be rejected
    - size unchanged after the rejected shrink
    - grow to 2 GiB (in-bounds)               -> MUST succeed

  Note on the below-floor step: the python-linstor `vd set-size` exposes
  no force flag, so a below-current shrink is refused by the shrink-
  direction gate; WITH force it is refused by the new floor gate. Both
  are correct rejections and both leave the size unchanged. The floor-
  gate-specific proof (force-shrink below 4 MiB -> 400 FAIL_INVLD_VLM_
  SIZE) lives in the same PR at the L1 handler + integration (envtest)
  tiers and in the L6 cell's raw-REST step
  (tests/e2e/cli-matrix/vd-resize-bounds-rejected.sh).

  RUN-DEFERRED (2026-07-03): the on-live-stand run needs the dev-kvaps
  oracle, unavailable this session. This YAML is the CLI-level paper
  trail required by the blockstor CLAUDE.md CLI-bug-fix protocol; a
  stand-pending task tracks running it (and the L6 cell) once the stand
  is up. The fix is already proven at the L1 + integration tiers, which
  fully cover a REST-layer input rejection.

  If this replay goes red, no fix in pkg/rest/volume_definitions.go
  (rejectVDPatchSize / rejectVDPatchOutOfBounds) may be claimed closed.

prerequisites:
  min_nodes: 2
  storage_pool: stand

vars:
  sp: stand

steps:
  - name: create-rd
    cmd: ["resource-definition", "create", "{{rd}}"]
    expect_exit: 0
  - name: create-vd-1g
    cmd: ["volume-definition", "create", "{{rd}}", "1G"]
    expect_exit: 0
    await:
      kind: vd_size_kib
      rd: "{{rd}}"
      vol: 0
      expected_kib: 1048576
      timeout_s: 30
  - name: auto-place-2
    cmd: ["resource", "create", "--auto-place", "2", "--storage-pool={{sp}}", "{{rd}}"]
    expect_exit: 0
    await:
      kind: replica_count
      rd: "{{rd}}"
      min: 2
      timeout_s: 120
  - name: wait-uptodate-1g
    cmd: ["resource", "list", "--resources", "{{rd}}"]
    expect_exit: 0
    await:
      kind: all_uptodate
      rd: "{{rd}}"
      timeout_s: 600

  # ---- Over-ceiling grow MUST be rejected ----
  # 1025T = 1 PiB + 1 TiB > maxVolumeDefinitionSizeKib (1 PiB).
  # python-linstor surfaces an API-level rejection as exit 10 and a
  # client/usage failure as exit 1; both mean "rejected", the load-
  # bearing contract (size does NOT change) is pinned below.
  - name: grow-over-ceiling-rejected
    cmd: ["volume-definition", "set-size", "{{rd}}", "0", "1025T"]
    expect_exit: [1, 10]
  - name: size-unchanged-after-ceiling-reject
    cmd: ["volume-definition", "list", "--resource-definitions", "{{rd}}"]
    expect_exit: 0
    await:
      kind: vd_size_kib
      rd: "{{rd}}"
      vol: 0
      expected_kib: 1048576
      timeout_s: 10

  # ---- Below-floor shrink MUST be rejected ----
  # 3M = 3 MiB < minVolumeDefinitionSizeKib (4 MiB). Rejected by the
  # shrink-direction gate (no force flag on the CLI) or the floor gate
  # (with force); either way the size stays 1G.
  - name: shrink-below-floor-rejected
    cmd: ["volume-definition", "set-size", "{{rd}}", "0", "3M"]
    expect_exit: [1, 10]
  - name: size-unchanged-after-floor-reject
    cmd: ["volume-definition", "list", "--resource-definitions", "{{rd}}"]
    expect_exit: 0
    await:
      kind: vd_size_kib
      rd: "{{rd}}"
      vol: 0
      expected_kib: 1048576
      timeout_s: 10

  # ---- In-bounds grow MUST succeed (no over-broad regression) ----
  - name: grow-in-bounds-2g
    cmd: ["volume-definition", "set-size", "{{rd}}", "0", "2G"]
    expect_exit: 0
    await:
      kind: vd_size_kib
      rd: "{{rd}}"
      vol: 0
      expected_kib: 2097152
      timeout_s: 60

teardown:
  - cmd: ["resource-definition", "delete", "{{rd}}"]
    expect_exit: 0
    await:
      kind: rd_absent
      rd: "{{rd}}"
      timeout_s: 60

invariants:
  - no_orphans
