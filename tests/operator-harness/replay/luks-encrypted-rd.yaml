name: luks-encrypted-rd
description: |
  Bug-333 catcher. Exercises an encrypted RD lifecycle:
    1. encryption create-passphrase
    2. controller set-property DrbdOptions/EncryptPassphrase <pp> is
       REFUSED (exit 10) and the prop stays absent
    3. rd create -l drbd,luks,storage
    4. vd create
    5. r create --auto-place=2
    6. snapshot create + delete (validates LUKS-aware snapshot path)
  Validates that the LUKS layer is included in the actual layer stack
  and snapshot path doesn't crash python-linstor.

  NOTE: the cluster passphrase Secret written by encryption
  create-passphrase is the only thing a LUKS-layered RD needs, and the
  only place the master passphrase is read from. The controller
  property DrbdOptions/EncryptPassphrase is never read; the REST API
  refuses to store it, since a property sits in plaintext on its CR.
  This is an intentional divergence from upstream LINSTOR (see
  docs/cli-parity-known-deltas.md). The L6 cell
  tests/e2e/cli-matrix/luks-rd-create-encrypted.sh runs the same
  Secret-only flow.

prerequisites:
  min_nodes: 2
  storage_pool: stand

vars:
  sp: stand
  passphrase: "fuzz-passphrase-do-not-rely-on"

steps:
  - name: ensure-passphrase
    # The passphrase is supplied via the -p/--passphrase FLAG; it is not a
    # positional (the CLI prompts interactively otherwise). The literal
    # value is fine here — the runner only substitutes {{rd}}/{{sp}}/{{rg}}/
    # {{node*}}, so a {{passphrase}} placeholder would pass through verbatim.
    # On a shared stand a passphrase may already exist, in which case the
    # controller returns "already exists" (exit 10); that is benign for the
    # rest of the workflow, so we accept it.
    cmd: ["encryption", "create-passphrase", "-p", "fuzz-passphrase-do-not-rely-on"]
    expect_exit: [0, 10]
  - name: set-encrypt-passphrase-property-refused
    # The passphrase never goes into a property: the controller answers
    # 400 and the CLI exits 10; nothing is stored, and the rd-create
    # below goes through on the Secret alone.
    cmd: ["controller", "set-property", "DrbdOptions/EncryptPassphrase", "fuzz-passphrase-decoy"]
    expect_exit: 10
    await:
      kind: prop_value
      obj: controller
      key: DrbdOptions/EncryptPassphrase
      timeout_s: 10
  - name: create-rd-luks
    cmd: ["resource-definition", "create", "{{rd}}", "-l", "drbd,luks,storage"]
    expect_exit: 0
  - name: create-vd
    cmd: ["volume-definition", "create", "{{rd}}", "32M"]
    expect_exit: 0
  - name: auto-place-2-encrypted
    cmd: ["resource", "create", "--auto-place", "2", "--storage-pool={{sp}}", "{{rd}}"]
    expect_exit: 0
    await:
      kind: replica_count
      rd: "{{rd}}"
      min: 2
      timeout_s: 120
  - name: wait-uptodate
    cmd: ["resource", "list", "--resources", "{{rd}}"]
    expect_exit: 0
    await:
      kind: all_uptodate
      rd: "{{rd}}"
      timeout_s: 240
  - name: snap-create
    cmd: ["snapshot", "create", "{{rd}}", "{{rd}}-snap"]
    expect_exit: 0
  - name: snap-delete
    cmd: ["snapshot", "delete", "{{rd}}", "{{rd}}-snap"]
    expect_exit: 0

teardown:
  - cmd: ["resource-definition", "delete", "{{rd}}"]

invariants:
  - no_orphans
