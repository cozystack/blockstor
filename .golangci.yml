version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - gochecknoinits
    - wsl
    - lll
    - errchkjson
    - ireturn
    - gocheckcompilerdirectives
  settings:
    staticcheck:
      # Enable the ST1003 naming checks (initialisms etc.) and the rest
      # of staticcheck's "all" set.
      checks:
        - all
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            # Allow the idiomatic  first parameter in test
            # helpers before context.Context.
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - upperCaseConst: true
                # Project initialisms not in revive's default set. DRBD,
                # ZFS, IO, ID, UUID, API, URL, HTTP are recognised by
                # default; GI (DRBD generation identifier) and VDO are not.
                extraInitialisms:
                  - GI
                  - VDO
    tagliatelle:
      case:
        rules:
          json: camel
        # The CRD types follow the K8s API convention of uppercasing
        # whole initialisms in camelCase JSON tags (cf. clusterIP,
        # podCIDR): currentGI, drbdNodeID, suspendIO, etc. tagliatelle's
        # camel rule would rewrite these to Go-style currentGi/drbdNodeId,
        # so the affected fields are pinned here.
        ignored-fields:
          - StableID
          - SeedFromGI
          - DRBDNodeID
          - PeerDRBDNodeID
          - CurrentGI
          - HistoryGI
          - SuspendIO
          - SuspendIOAcked
          - GroupID
          - SharedSpaceID
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - dupImport
        - unnamedResult
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    funlen:
      lines: 60
      statements: 60
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 15
    mnd:
      ignored-numbers:
        - "10"
        - "100"
        - "1000"
        - "2"
        - "60"
        - "60.0"
        - "64"
        - "500"
    gomoddirectives:
      replace-allow-list:
        - github.com/cloudflare/cloudflared
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-receiver: false
      check-return: false
      ignore-type-assert-ok: false
      ignore-map-index-ok: false
      ignore-chan-recv-ok: false
      ignore-decls:
        - wg sync.WaitGroup
        - wg *sync.WaitGroup
        - mu sync.Mutex
        - ok bool
      ignore-names:
        - i
        - w
        - r
        - b
        - c
        - m
        - n
        - in
        - sp
        - st
        - s
        - cm
        - vd
        - vn
        - rd
        - ln
        - gs
        - vd
        - rg
        - vg
        - tt
        - rw
        - ev
        - ch
        - dr
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples/
      - generated\.go$
    rules:
      - linters:
          - funlen
          - dupl
          - gocognit
          - gocyclo
          - cyclop
          - errcheck
          - testableexamples
          - testpackage
          - forcetypeassert
          - gocritic
          - nlreturn
          - wsl_v5
          - varnamelen
          - unparam
          - modernize
          - gosec
          - testifylint
          - perfsprint
          - paralleltest
          - maintidx
          - goconst
          - noinlineerr
        path: _test\.go
      # k8s store implementations follow the same Get/Create/Update/Delete
      # template per resource — duplication is the point and is shared via
      # the storetest suite already.
      - linters:
          - dupl
        path: pkg/store/k8s/
      # Same applies to the in-memory store implementations and the
      # interface definitions in pkg/store/store.go (per-resource Store
      # interfaces share the same shape on purpose).
      - linters:
          - dupl
        path: pkg/store/inmemory
      - linters:
          - dupl
        path: pkg/store/store\.go
      # REST handlers follow the same Get/Create/Update/Delete shape per
      # resource for the same reason.
      - linters:
          - dupl
        path: pkg/rest/
      # gRPC handlers idiomatically return google.golang.org/grpc/status
      # errors verbatim — wrapping them via cockroachdb/errors would defeat
      # gRPC's status code propagation. The same applies to dupl since
      # every handler follows the validate→store→respond shape.
      - linters:
          - wrapcheck
          - dupl
        path: pkg/satellitecontroller/
      # Status-Condition stampers (Phase 11.3 Stages 1+2) are
      # intentionally parallel one-Condition-per-file SSA writers —
      # MetadataCreated, FilesystemFormatted, and future Condition
      # writers share the same shape on purpose so the field-owner
      # registry stays one-line-per-writer.
      - linters:
          - dupl
        path: pkg/satellite/controllers/(metadata_created|filesystem_formatted)_stamper\.go
      # storetest is a shared test suite imported by both InMemory and k8s
      # store tests. It contains test code, just not in _test.go files, so
      # the same exclusions apply.
      - linters:
          - funlen
          - dupl
          - gocognit
          - gocyclo
          - cyclop
          - gocritic
          - nlreturn
          - wsl_v5
          - varnamelen
          - goconst
          - noinlineerr
          - thelper
          - unparam
        path: pkg/store/storetest/
      - linters:
          - forbidigo
          - gocyclo
          - cyclop
          - goconst
          - funlen
          - gocognit
          - nestif
          - gocritic
          - maintidx
        path: examples/
      # Controller patterns - helper methods near reconcile logic
      - linters:
          - funcorder
        path: internal/controller/
      # Controller patterns - inline error handling in reconcile
      - linters:
          - noinlineerr
        path: internal/controller/
      # blockstor reproduces the LINSTOR REST API contract, which uses
      # snake_case JSON. Keep golinstor-compatible names verbatim.
      - linters:
          - tagliatelle
        path: pkg/api/
      # REST handlers occasionally define request envelopes inline that
      # mirror the upstream snake_case JSON. Same scope as pkg/api/.
      - linters:
          - tagliatelle
        path: pkg/rest/
      # pkg/drbd/drbdsetup_show.go mirrors drbd-utils' on-the-wire JSON
      # shape (`drbdsetup show -j`) which uses snake_case with leading
      # underscores on private-implementation fields. The JSON tags
      # MUST match verbatim or the parser breaks on real-world output.
      - linters:
          - tagliatelle
        path: pkg/drbd/drbdsetup_show
      # cmd/{controller,satellite}/main.go is kubebuilder manager scaffold —
      # don't lint its boilerplate (TODOs, function length, globals, inline
      # err checks, wsl). tagliatelle/goconst/mnd are excluded too: the
      # cold-start kernel-safety probe mirrors drbd-utils' `drbdsetup
      # status -j` JSON shape (kebab/snake keys that MUST match verbatim)
      # and uses small inline state-string literals + per-probe timeouts.
      - linters:
          - funlen
          - gochecknoglobals
          - godox
          - gocritic
          - goconst
          - mnd
          - noinlineerr
          - tagliatelle
          - wsl_v5
          - cyclop
          - gocyclo
          - maintidx
        path: cmd/(controller|satellite)/main\.go
      # api/v1alpha1 and internal/controller are kubebuilder scaffold; the
      # boilerplate (dot-imports for ginkgo/gomega, generated DeepCopy globals,
      # ginkgo BeforeSuite TODOs, wrapcheck on framework returns) is not
      # something we should fight.
      - linters:
          - gochecknoglobals
          - godot
          - godox
          - wrapcheck
          - embeddedstructfieldcheck
          - fatcontext
          - varnamelen
        path: api/v1alpha1/
      - linters:
          - gochecknoglobals
          - godot
          - godox
          - wrapcheck
          - embeddedstructfieldcheck
          - fatcontext
          - varnamelen
        path: internal/controller/
      # test/ is kubebuilder-generated e2e helpers; same scaffolding boilerplate.
      - linters:
          - gochecknoglobals
          - godot
          - godox
          - revive
          - wrapcheck
          - err113
          - gocritic
          - nlreturn
          - noctx
          - noinlineerr
          - nolintlint
          - wsl_v5
          - varnamelen
          - mnd
        path: test/
      # Production-code packages use `Bug NNN:` markers as a deliberate
      # cross-reference index into the project's bug tracker (the comments
      # document WHY a workaround exists and point at the underlying issue).
      # godox would flag them as stray TODO/BUG/FIXME — disable ONLY godox
      # for these paths; every other linter still applies.
      - linters:
          - godox
        path: cmd/apiserver/
      - linters:
          - godox
        path: pkg/api/v1/
      - linters:
          - godox
        path: pkg/drbd/
      - linters:
          - godox
        path: pkg/luks/
      - linters:
          - godox
        path: pkg/storage/
      - linters:
          - godox
        path: pkg/store/
      - linters:
          - godox
        path: pkg/uevent/
      - linters:
          - godox
        path: tests/contract/
      - linters:
          - godox
        path: pkg/rest/
      - linters:
          - godox
        path: pkg/passphrase/
      - linters:
          - godox
        path: pkg/satellite/
      - linters:
          - godox
        path: pkg/dispatcher/
      - linters:
          - godox
        path: pkg/placer/
      - linters:
          - godox
        path: pkg/version/
      # linstor-trace-recorder is a dev tool that writes JSON traces
      # under -out-dir; gosec G703 flags the os.WriteFile call despite
      # the explicit filepath.Base sanitisation right above it (taint
      # analysis can't see through the local-variable assignment).
      - linters:
          - gosec
        path: cmd/linstor-trace-recorder/
      # pkg/storage/file/diskfree.go does an int64(stat.Bsize)
      # conversion that is a no-op on Linux (Bsize int64) but
      # required on macOS (Bsize uint32). unconvert can't see the
      # cross-platform shape, so the conversion is flagged as
      # unnecessary on Linux builds.
      - linters:
          - unconvert
        path: pkg/storage/file/diskfree\.go
      # pkg/drbd/devnode.go casts stat.Rdev to uint64 for the same
      # cross-platform reason: Rdev is uint64 on Linux (so the cast is
      # a no-op and unconvert flags it, while the //nolint:gosec for the
      # G115 conversion looks unused) but uint32 on some platforms where
      # both the cast and the gosec suppression are required.
      - linters:
          - unconvert
          - nolintlint
        path: pkg/drbd/devnode(_test)?\.go
      # peer_delete_sync.go contains Bug 342 v10 plumbing (per-peer
      # forget-peer ACK annotations) that's staged on the satellite side
      # but not yet called from the REST handler. The unused-code is
      # intentional and reviewed; remove the exclusion when the v10
      # wire-up lands.
      - linters:
          - unused
          - funlen
          - wrapcheck
          - varnamelen
        path: pkg/rest/peer_delete_sync\.go
      # kv_store.go's KV PUT body shape contains LINSTOR-wire field
      # names (override_props / delete_props / delete_namespaces) that
      # appear both in the field-name allow-list and the corresponding
      # unmarshal target — extracting constants doesn't aid readability
      # since the literals match the JSON keys verbatim.
      - linters:
          - goconst
        path: pkg/rest/kv_store\.go
      # resources.go's boolQuery parser enumerates strconv.ParseBool's
      # truthy alternatives + curl-style "yes"/"on"; the literals are
      # parser cases, not magic constants.
      - linters:
          - goconst
        path: pkg/rest/resources\.go
      # resource_toggle_disk.go composes wire-status strings
      # ("diskful"/"diskless") in a short branch; goconst miscounts
      # these as repeated literals against the rest of the package.
      - linters:
          - goconst
        path: pkg/rest/resource_toggle_disk\.go
      # reconciler_drbd_test.go reserves sentinel errors for paths
      # that aren't yet exercised by the fixture; the sentinels stay
      # so the table-driven scaffolding can grow incrementally without
      # re-introducing the same constants on each addition.
      - linters:
          - unused
        path: pkg/satellite/reconciler_drbd_test\.go
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples/
      - generated\.go$
      - test/utils/
